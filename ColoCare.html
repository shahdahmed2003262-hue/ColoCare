<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ColoCare</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5df;--card:#fff;--ink:#1d2a14;--mut:#66745a;--g:#86c440;--gd:#4f8a14;--gl:#e3f0cb;--line:#dfe8cf;--bad:#c9443f;--wn:#b9770e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a0e;--card:#1e2918;--ink:#eef5e4;--mut:#a4b394;--gl:#2b3a20;--line:#2f3d26;--gd:#a5d96a}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:4px 0 2px;line-height:1.2}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;margin:0 0 4px}p{margin:6px 0}
.mut{color:var(--mut);font-size:13px}.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(80,120,30,.08)}
.btn{display:block;width:100%;border:0;border-radius:30px;background:var(--g);color:#16260a;font:700 16px inherit;font-family:inherit;padding:14px;margin-top:14px;cursor:pointer}
.btn.alt{background:var(--gl);color:var(--gd)}
label{display:block;font-weight:600;margin-top:12px;font-size:13px}
input,select{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.hero{text-align:center;padding-top:20px}.hero img{width:78%;border-radius:50%;box-shadow:0 10px 30px rgba(80,120,30,.3)}
.hero h1{font-size:32px;margin-top:24px}
.ring{position:relative;width:190px;margin:6px auto}.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:34px;line-height:1}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mac .card{text-align:center;margin:0;padding:10px}.mac b{display:block;font-size:17px}
.meal{display:flex;gap:12px;align-items:center}.meal img,.ph{width:56px;height:56px;border-radius:14px;object-fit:cover}
.meal .k{margin-left:auto;text-align:right;font-weight:800;color:var(--gd)}
.chip{display:inline-block;background:var(--gl);color:var(--gd);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{display:flex;width:100%;max-width:456px;background:var(--card);border-radius:28px;padding:6px;box-shadow:0 4px 20px rgba(60,100,20,.18)}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px inherit;font-family:inherit;padding:6px 0;border-radius:22px;cursor:pointer}
.nav button.on{background:var(--g);color:#16260a}.nav span{display:block;font-size:19px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-weight:400;font-size:14px;margin:0}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--g)}
.res{border-left:6px solid var(--g)}.res.m{border-color:#e8a33d}.res.h{border-color:var(--bad)}
.sev{display:flex;gap:6px;margin-top:6px}.sev button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 0;font:inherit;cursor:pointer}
.sev button.on{background:var(--g);border-color:var(--g);color:#16260a;font-weight:700}
.warn{background:#fdecea;color:#8a2622;border-radius:14px;padding:10px;font-size:13px}
@media(prefers-color-scheme:dark){.warn{background:#3a1f1d;color:#f3b8b4}}
details{padding:0}summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
.rimg{width:100%;height:170px;object-fit:cover;border-radius:16px;margin-bottom:8px}
ol,ul{padding-left:20px;margin:6px 0}.foot{font-size:12px;color:var(--mut);text-align:center;margin-top:20px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
</style></head><body><div id="app"></div>

{n:"Warm Golden Oatmeal with Stewed Blueberries and Flaxseed",m:"Breakfast",ing:"½ cup rolled oats, 1 cup milk or water, ½ cup blueberries, 1 tbsp ground flaxseed, ½ tsp cinnamon, 1 tsp honey, ½ tsp vanilla extract",st:["Cook oats with milk, cinnamon, and vanilla over medium heat for 5–7 minutes.","Simmer blueberries with honey and a little water for 4–5 minutes until soft.","Pour oatmeal into a bowl.","Top with stewed blueberries and ground flaxseed."],b:"Soluble fiber calms the digestive tract and promotes smooth bowel regularity without cramping. Antioxidants help neutralize cell-damaging free radicals and reduce intestinal inflammation. Alpha-linolenic acid (ALA) helps lower systemic inflammation and nourishes the gut microbiome."},
{n:"Creamy Butternut Squash and Avocado Soup",m:"Lunch",ing:"1 cup peeled and diced butternut squash, ½ ripe avocado, ½ small onion (chopped), 1 garlic clove, 2 cups vegetable broth, 1 tsp olive oil, salt and black pepper to taste",st:["Sauté onion and garlic in olive oil until soft.","Add butternut squash and vegetable broth. Simmer for 15–20 minutes until tender.","Add avocado and blend until smooth and creamy.","Season with salt and pepper."],b:"Avocado provides gentle calories and monounsaturated fatty acids that help absorb fat-soluble vitamins (A and E). Blending removes rough fibers that could irritate an inflamed colon, making nutrient uptake fast and effortless."},
{n:"Soothing Bone Broth and White Fish Vegetable Soup",m:"Lunch",ing:"150 g white fish fillet, 2 cups bone broth, ½ carrot (chopped), ½ zucchini (chopped), ¼ cup spinach, 1 garlic clove, 1 tsp olive oil, salt and black pepper to taste",st:["Heat olive oil and sauté garlic lightly.","Add bone broth, carrot, and zucchini. Simmer for 10 minutes.","Add the white fish and cook for 5–7 minutes until fully cooked.","Stir in spinach and season with salt and pepper."],b:"Bone broth is rich in amino acids like glycine and glutamine, which help support the intestinal mucosal lining. White fish is very lean and flaky, needing minimal digestive effort while delivering vital protein."},
{n:"Baked Salmon with Turmeric-Ginger Quinoa & Steamed Zucchini",m:"Dinner",ing:"Salmon fillets, quinoa, zucchini, turmeric and fresh ginger, olive oil, lemon juice, salt and black pepper",st:["Season salmon with olive oil, lemon, salt, and pepper. Bake at 200°C for 12–15 minutes.","Cook quinoa with water, turmeric, and ginger for 15 minutes.","Steam sliced zucchini for 5–7 minutes.","Serve salmon with quinoa and zucchini."],b:"Delivers anti-inflammatory compounds, omega-3s, and moderate soluble fiber to encourage healthy colonic fermentation."},
{n:"Golden Lentil & Pumpkin Pureed Soup",m:"Lunch",ing:"Red or yellow lentils, pumpkin (peeled and diced), onion and garlic, vegetable broth or water, olive oil, turmeric, cumin, salt, and black pepper",st:["Sauté onion and garlic in olive oil.","Add pumpkin, lentils, spices, and broth.","Simmer for 20–25 minutes until tender.","Blend until smooth and creamy.","Serve warm with a drizzle of olive oil."],b:"Provides soluble fiber, prebiotics, and glutamine-rich broth for enterocyte repair."}];

const NUT=[["Fiber","Vegetables, fruits, oats, brown rice, quinoa. Shortens contact time of harmful compounds with the colon lining, dilutes colon contents, feeds short-chain fatty acid production, and supplies polyphenols and carotenoids."],["Folate (vitamin B9)","Lowers homocysteine, which is linked to higher colorectal cancer predisposition."],["Vitamin B6","Legumes, fish, poultry, whole grains."],["Lean protein","Poultry, fish and plant foods (legumes) instead of red and processed meat."],["Calcium","Dairy products support healthy cell growth and lifespan and lower colon cancer risk."]];
const ADV=["Get adequate calories","Eat enough to maintain your weight and muscle mass","Eat smaller portions","Eat high protein with most meals and snacks","Stay hydrated","Consume healthy fats"];
const LIFE=["Choose a balanced, fiber-rich pattern: vegetables, fruits, legumes and whole grains regularly.","Limit processed meat and moderate red meat.","Replace some meat servings with fish, poultry, beans, lentils or other plant proteins.","Maintain a healthy weight and stay physically active.","Avoid tobacco and limit or avoid alcohol.","Do not self-prescribe aspirin or other medicines for cancer prevention."];
const AF=[["Mostly sitting (little exercise)",1.2],["Light (1–3 days/week)",1.375],["Moderate (3–5 days/week)",1.55],["Very active (6–7 days/week)",1.725]];
let S={tab:"home",p:null,log:[],eaten:{},risk:[],draft:{},sev:{},start:true};
try{const x=JSON.parse(localStorage.getItem("cc")||"null");if(x){S=Object.assign(S,x);S.start=!S.p}}catch(e){}
const sv=()=>{try{localStorage.setItem("cc",JSON.stringify({p:S.p,log:S.log,eaten:S.eaten,risk:S.risk}))}catch(e){}};
const $=q=>document.querySelector(q),A=document.getElementById("app");
const day=new Date().toDateString();if(S.eaten.d!==day)S.eaten={d:day};
function calc(f){const bmr=10*f.w+6.25*f.h-5*f.a+(f.g=="m"?5:-161);return{bmr:Math.round(bmr),tdee:Math.round(bmr*f.af),bmi:+(f.w/((f.h/100)**2)).toFixed(1)}}
const pat=()=>S.p&&S.p.crc;
const tabs=()=>pat()?[["home","🏠","Home"],["plan","🥗","Plan"],["sym","🩺","Symptoms"],["rec","🍳","Recipes"],["learn","📖","Learn"]]:[["home","🏠","Home"],["risk","🛡️","Risk"],["rec","🍳","Recipes"],["learn","📖","Learn"]];
function plan(){const t=S.p.tdee,d=new Date().getDay(),l=[1,2,4,2,1,4,2][d];return[["Breakfast",0,.25],["Lunch",l,.3],["Snack",null,.15],["Dinner",3,.3]].map(([n,i,s])=>({n,i,k:Math.round(t*s/10)*10}))}
function ring(c,t){const r=80,L=2*Math.PI*r,f=Math.min(1,c/t);return`<div class="ring"><svg viewBox="0 0 190 190" width="190" height="190"><circle cx="95" cy="95" r="${r}" fill="none" stroke="var(--gl)" stroke-width="14"/><circle cx="95" cy="95" r="${r}" fill="none" stroke="var(--g)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${L*f} ${L}" transform="rotate(-90 95 95)"/></svg><div class="t"><span class="mut">Today</span><b>${c}</b><span class="mut">of ${t} kcal</span></div></div>`}
function home(){const p=S.p,pl=plan(),c=pl.reduce((s,m,i)=>s+(S.eaten[i]?m.k:0),0),pr=Math.round(p.w*(p.crc?1.2:1)),fa=Math.round(p.tdee*.3/9),cb=Math.round((p.tdee-pr*4-fa*9)/4);
return`<h1>Hello, ${esc(p.name)}</h1><p class="mut">${p.crc?"Colorectal cancer support":"Prevention & healthy living"} · BMI ${p.bmi}</p>
<div class="card">${ring(c,p.tdee)}<p class="mut" style="text-align:center">Daily target = TDEE (Mifflin-St Jeor). BMR ${p.bmr} kcal × activity ${p.af}</p></div>
<div class="mac"><div class="card"><span class="mut">Protein</span><b>${pr} g</b></div><div class="card"><span class="mut">Carbs</span><b>${cb} g</b></div><div class="card"><span class="mut">Fat</span><b>${fa} g</b></div></div>
<h2>Today’s meals</h2>${pl.map((m,i)=>{const r=m.i===null?null:R[m.i];return`<label class="card meal" style="margin:8px 0"><input type="checkbox" ${S.eaten[i]?"checked":""} onchange="eat(${i})" style="width:20px;margin:0;accent-color:var(--g)">${r?`<img src="${IM[m.i]}" alt="">`:`<div class="ph" style="background:var(--gl)"></div>`}<div><b>${m.n}</b><div class="mut">${r?r.n:"Yogurt or milk, fruit, or a handful of nuts"}</div></div><div class="k">${m.k}<div class="mut">kcal</div></div></label>`}).join("")}
${p.crc?(p.surg!="none"?`<div class="card"><h3>${p.surg=="planned"?"Surgery planned":"After surgery"}</h3><p class="mut">Follow the diet instructions from your surgical team (for example low-residue or soft foods). ColoCare suggestions do not replace them.</p></div>`:""):`<h2>Lifestyle for prevention</h2><div class="card"><ul>${LIFE.map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn alt" onclick="go('risk')">Check my risk level</button></div>`}
<button class="btn alt" onclick="S.start=true;S.edit=1;draw()">Edit my details</button>`}
function planV(){return`<h1>Nutrition plan</h1><p class="mut">Key nutrients your meals should include</p>${NUT.map(([a,b])=>`<div class="card"><h3>${a}</h3><p class="mut">${b}</p></div>`).join("")}<h2>Advice during treatment</h2><div class="card"><ul>${ADV.map(x=>`<li>${x}</li>`).join("")}</ul></div><h2>Your day</h2><div class="card"><p>Target <b>${S.p.tdee} kcal</b> and about <b>${Math.round(S.p.w*1.2)} g protein</b>. Split it into smaller portions across the meals on Home, and tick them off as you eat.</p></div><button class="btn" onclick="go('rec')">Browse recipes</button>`}
function symV(){const d=S.draft;return`<h1>Symptom tracker</h1><p class="mut">Rate how you feel today: 0 none, 3 severe.</p><div class="card">${SYM.map((s,i)=>`<div style="margin:8px 0"><b>${s}</b><div class="sev">${[0,1,2,3].map(v=>`<button class="${(d[i]||0)==v?"on":""}" onclick="rs(${i},${v})">${v}</button>`).join("")}</div></div>`).join("")}<button class="btn" onclick="logSym()">Save today’s entry</button></div>
${S.msg||""}<h2>History</h2>${S.log.length?S.log.slice().reverse().map(e=>`<div class="card"><b>${e.d}</b><div>${e.s.length?e.s.map(x=>`<span class="chip">${SYM[x[0]]} · ${x[1]}</span>`).join(""):'<span class="mut">No symptoms recorded</span>'}</div></div>`).join(""):'<p class="mut">No entries yet. Save your first one above.</p>'}`}
function riskV(){const r=S.risk;let out="";if(S.done){const h=r.some(i=>RISK[i][1]==2),m=r.some(i=>RISK[i][1]==1),k=h?"h":m?"m":"";out=`<div class="card res ${k}"><h3>${h?"High risk":m?"Moderate risk":"Low / average risk"}</h3><p>${h?"An inherited syndrome or long-standing IBD overrides other factors. Speak with a gastroenterologist about a personalised screening plan.":m?"Family or personal history raises your risk above average. Ask your doctor when to begin screening and how often.":"Lifestyle factors and age alone keep you in the low / average group, but they are still worth improving. Follow regular screening from age 45."}</p></div>`}
return`<h1>Risk assessment</h1><p class="mut">Select everything that applies to you.</p><div class="card">${RISK.map((x,i)=>`<label class="opt"><input type="checkbox" ${r.includes(i)?"checked":""} onchange="rk(${i},this.checked)">${x[0]}</label>`).join("")}<label class="opt"><input type="checkbox" ${r.includes(-1)?"checked":""} onchange="rk(-1,this.checked)">None of these</label><button class="btn" onclick="S.done=1;draw()">Classify my risk</button></div>${out}${S.done?`<h2>Prevention tips</h2><div class="card"><ul>${LIFE.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}`}
function recV(){return`<h1>Recipes</h1><p class="mut">Gentle, nutrient-rich meals. Tap a recipe to open it.</p>${R.map((r,i)=>`<details class="card"><summary><img class="rimg" src="${IM[i]}" alt="${esc(r.n)}"><span class="chip">${r.m}</span><h3>${r.n}</h3></summary><p><b>Ingredients:</b> ${r.ing}</p><b>Preparation</b><ol>${r.st.map(s=>`<li>${s}</li>`).join("")}</ol><p><b>Benefit:</b> ${r.b}</p></details>`).join("")}`}
function learnV(){return`<h1>Learn</h1><div class="card"><h3>What is colorectal cancer?</h3><p>Colorectal cancer (CRC) is a malignant tumor that starts in the lining of the colon or rectum, part of the lower gastrointestinal tract. The two types are adenocarcinoma and non-adenocarcinoma. It is a relevant public health concern in Egypt: GLOBOCAN 2022 (IARC) ranks it among the five most diagnosed cancers in Egyptian women.</p></div>
<div class="card"><h3>Stages</h3><ul><li><b>Stage 0:</b> cells are confined to the mucosa (carcinoma in situ).</li><li><b>Stage I:</b> deeper layers of the bowel wall are invaded; no lymph node or distant spread.</li><li><b>Stage II:</b> grown through the muscular wall or into nearby tissue; no lymph node or distant spread.</li><li><b>Stage III:</b> spread to regional lymph nodes.</li><li><b>Stage IV:</b> spread to distant organs, commonly the liver, lungs or peritoneum.</li></ul></div>
<div class="card"><h3>Symptoms</h3><ul><li><b>Altered bowel habits:</b> persistent constipation or diarrhea</li><li><b>Gastrointestinal bleeding</b></li><li><b>Abdominal discomfort:</b> persistent cramping, bloating, fullness or localized pain</li><li><b>Systemic:</b> unexplained weight loss, chronic fatigue, loss of appetite, general malaise</li></ul></div>`}
function setup(){const f=S.f||(S.p||{a:"",w:"",h:"",name:"",g:"f",af:1.375,crc:0,surg:"none"});const v=(k)=>f[k]??"";
return`<div class="hero"><img src="${IM[4]}" alt="">${S.p||S.go?"":`<h1>Eat Smart,<br><span style="color:var(--gd)">Live Better</span></h1><p class="mut">ColoCare: nutrition support for colorectal cancer patients and prevention for everyone else.</p><button class="btn" onclick="S.go=1;draw()">Get started</button>`}</div>`}
function form(){const f=S.p||{};const g=k=>f[k]??"";return`<h1>Welcome to ColoCare</h1><p class="mut">Tell us about you to calculate your daily energy needs.</p><div class="card"><label>Name<input id="n" value="${esc(g("name"))}" autocomplete="given-name"></label><div class="row"><label>Age<input id="a" type="number" min="1" max="110" value="${g("a")}"></label><label>Gender<select id="g"><option value="f" ${f.g=="f"?"selected":""}>Female</option><option value="m" ${f.g=="m"?"selected":""}>Male</option></select></label></div><div class="row"><label>Weight (kg)<input id="w" type="number" min="20" max="300" value="${g("w")}"></label><label>Height (cm)<input id="h" type="number" min="100" max="230" value="${g("h")}"></label></div><label>Activity level<select id="af">${AF.map(x=>`<option value="${x[1]}" ${f.af==x[1]?"selected":""}>${x[0]}</option>`).join("")}</select></label><label>Do you have colorectal cancer?<select id="c" onchange="$('#sg').style.display=this.value=='1'?'block':'none'"><option value="0">No</option><option value="1" ${f.crc?"selected":""}>Yes</option></select></label><div id="sg" style="display:${f.crc?"block":"none"}"><label>Colorectal surgery<select id="s"><option value="none">No surgery</option><option value="planned" ${f.surg=="planned"?"selected":""}>Planned</option><option value="done" ${f.surg=="done"?"selected":""}>Already had surgery</option></select></label></div><div id="er" class="warn" style="display:none;margin-top:12px"></div><button class="btn" onclick="submit()">Calculate and continue</button></div>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function submit(){const f={name:$("#n").value.trim(),a:+$("#a").value,w:+$("#w").value,h:+$("#h").value,g:$("#g").value,af:+$("#af").value,crc:+$("#c").value,surg:+$("#c").value?$("#s").value:"none"};
if(!f.name||!(f.a>0)||!(f.w>0)||!(f.h>0)){const e=$("#er");e.style.display="block";e.textContent="Enter your name, age, weight and height to continue.";return}
S.p=Object.assign(f,calc(f));S.start=false;S.tab="home";sv();draw()}
function eat(i){S.eaten[i]=!S.eaten[i];sv();draw()}function go(t){S.tab=t;draw();scrollTo(0,0)}
function rs(i,v){S.draft[i]=v;draw()}
function logSym(){const s=Object.entries(S.draft).filter(x=>x[1]>0).map(x=>[+x[0],x[1]]);S.log.push({d:new Date().toLocaleDateString(),s});S.draft={};S.msg=s.some(x=>x[0]==2||x[1]==3)?'<div class="warn">You recorded bleeding or a severe symptom. Contact your care team promptly.</div>':'<div class="card">Entry saved.</div>';sv();draw()}
function rk(i,on){let r=S.risk;if(i==-1)r=on?[-1]:[];else{r=r.filter(x=>x!=-1&&x!=i);if(on)r.push(i)}S.risk=r;S.done=0;sv();draw()}
function draw(){let h;if(S.start){h=(S.p||S.go)?form():setup()}else{const t=S.tab;h=({home,plan:planV,sym:symV,risk:riskV,rec:recV,learn:learnV}[t]||home)();h+=`<p class="foot">ColoCare gives general education, not medical advice. Always follow your doctor or dietitian.</p><nav class="nav"><div>${tabs().map(x=>`<button class="${x[0]==t?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</div></nav>`}
A.innerHTML=h}
draw();
</script></body></html>
